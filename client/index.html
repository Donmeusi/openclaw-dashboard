<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            github: {
              bg: '#0d1117',
              surface: '#161b22',
              border: '#30363d',
              text: '#c9d1d9',
              muted: '#8b949e',
              accent: '#58a6ff',
              success: '#238636',
              warning: '#f0883e',
              danger: '#f85149'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    .github-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
    }
    .github-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .github-btn:hover {
      background: #30363d;
      border-color: #8b949e;
    }
    .github-btn-primary {
      background: #238636;
      border-color: #238636;
      color: white;
    }
    .github-btn-primary:hover {
      background: #2ea043;
      border-color: #2ea043;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      color: #c9d1d9;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }
    .sidebar-link:hover {
      background: #161b22;
    }
    .sidebar-link.active {
      background: #21262d;
      font-weight: 600;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-available {
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid rgba(35, 134, 54, 0.4);
    }
    .status-busy {
      background: rgba(248, 81, 73, 0.2);
      color: #f85149;
      border: 1px solid rgba(248, 81, 73, 0.4);
    }
    .kanban-column {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      min-height: 200px;
    }
    .kanban-card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: grab;
    }
    .kanban-card:hover {
      border-color: #58a6ff;
    }
    .editor-textarea {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 16px;
      width: 100%;
      resize: vertical;
      min-height: 400px;
    }
    .editor-textarea:focus {
      outline: none;
      border-color: #58a6ff;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0d1117;
    }
    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
